# Shared by unsigned local packages and the opt-in release build.
appId: app.juno.desktop
productName: Juno
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
  # koffi ships its C++ sources, headers and docs; the app needs only its JS and the prebuilt .node.
  - "!**/node_modules/koffi/{doc,lib,vendor}/**"
  - "!**/node_modules/koffi/src/koffi/src/abi/**"
  - "!**/node_modules/koffi/**/*.{cc,hh,inc,def,d.ts}"
  - "!**/node_modules/koffi/**/{CMakeLists.txt,CHANGELOG.md,README.md,cnoke.cjs}"
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  darkModeSupport: true
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
npmRebuild: true
asarUnpack:
  - "**/*.node"
  - "**/koffi/**"
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# No inferred GitHub repository. A configured public feed is supplied by package.cjs.
publish: null
