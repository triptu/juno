# Packaging config for `pnpm package`. Not run in CI yet.
appId: app.juno.desktop
productName: Juno
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  darkModeSupport: true
  icon: build/icon.icns
  hardenedRuntime: true
npmRebuild: false
