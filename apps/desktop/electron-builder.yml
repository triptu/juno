# Shared by unsigned local packages and the opt-in release build.
appId: app.juno.desktop
productName: Juno
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - THIRD_PARTY_NOTICES.txt
  # The updater's repository and read-only token, written by build/package.cjs when JUNO_UPDATE_TOKEN is set.
  - update.json
  - "!**/*.map"
  # koffi ships its C++ sources, headers and docs; the app needs only its JS and the prebuilt .node.
  - "!**/node_modules/koffi/{doc,lib,vendor}/**"
  - "!**/node_modules/koffi/src/koffi/src/abi/**"
  - "!**/node_modules/koffi/**/*.{cc,hh,inc,def,d.ts}"
  - "!**/node_modules/koffi/**/{CMakeLists.txt,CHANGELOG.md,README.md,cnoke.cjs}"
asar: true
# Juno's UI is English only, so ship only Chromium's English locale packs; the others are 49 MB.
# en_GB keeps British date and number formats on a Mac set to English (UK). Any other language
# falls back to en (en-US). macOS never loads the gendered packs (docs/development.md, "Releasing").
electronLanguages:
  - en
  - en_GB
mac:
  category: public.app-category.productivity
  target:
    - dmg
  darkModeSupport: true
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # The macOS microphone prompt's line, for huddles (SPEC 20).
  extendInfo:
    NSMicrophoneUsageDescription: Juno uses the microphone when you join a Slack huddle.
# An unsigned x64 installer for trying Juno on Windows, built on Windows (docs/development.md, "Windows build").
win:
  target:
    - target: nsis
      arch: x64
  # electron-builder makes the .ico from this 1024 px PNG.
  icon: build/icon.png
  # The tray icon at 16, 24 and 32 px (main/taskbar.ts).
  extraResources:
    - from: build
      to: .
      filter:
        - "tray*.png"
  # Windows names its locale packs en-US.pak and en-GB.pak; the macOS list above would delete both.
  electronLanguages:
    - en-US
    - en-GB
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
npmRebuild: true
asarUnpack:
  - "**/*.node"
  - "**/koffi/**"
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# No inferred GitHub repository. build/package.cjs names the private releases repository.
publish: null
