name: Check
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # setup-bun cannot install a given canary, so install the build packageManager
      # pins from npm; the preinstall check compares its commit.
      - name: Install the pinned Bun
        run: npm install -g "bun@$(node -p "require('./package.json').packageManager.replace(/^bun@/, '').split('+')[0]")"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Heavy suites run through bun run affected and bun run verify:main on the SSH laptop.
