packages:
  - apps/*
  - packages/*
  - docs/juno-agent/spikes

# pnpm 12 refuses to run dependency install scripts unless each package is
# approved or denied here. electron needs its postinstall to download the
# binary; esbuild and bun use theirs to select the platform binary.
allowBuilds:
  bun: true
  electron: true
  esbuild: true
  electron-winstaller: false
  # pi-ai pulls in the Google and gRPC SDKs as lazy chunks; Juno uses only its
  # OpenRouter provider and does not need their postinstall scripts.
  "@google/genai": false
  protobufjs: false
  # koffi's install script only checks that its prebuilt binary loads, and
  # builds from source with CMake when it does not. The binary comes from its
  # @koromix/koffi-<platform> optional dependency, so the script is not needed.
  koffi: false

# pnpm 12 holds back versions younger than its minimum release age. effect
# 4.0.3 was published a day before this file was written, so it is excluded
# from that policy on purpose.
minimumReleaseAgeExclude:
  - effect@4.0.3
  # vitest 5.0.4 and its @vitest/* parts were published the day fake-slack was
  # set up.
  - vitest@5.0.4
  - "@vitest/*"
  - "@earendil-works/chord@1.2.0"
  - "@earendil-works/pi-ai@1.2.0"
  - "@earendil-works/pi-codemode@1.2.0"
  - "@earendil-works/pi-durable@1.2.0"
  - "@earendil-works/pi-mcp@1.2.0"
  - "@earendil-works/pi-telemetry@1.2.0"

# The agent's tests use @juno/agent-testing, which imports the agent's crash
# points: a test-only cycle. check-deps leaves test-only edges out of its cycle
# check and fails on any other cycle; this tells `pnpm -r` the same.
ignoreWorkspaceCycles: true

# Every worktree links its packages from one shared folder in the store
# (`<store>/links`), so a worktree's node_modules holds about 1,000 entries
# instead of about 50,000. Creating and removing worktrees then stays cheap for
# macOS's file event and Spotlight services. See docs/development.md,
# "Worktrees and installs".
virtualStoreType: global

# With the shared store, a package resolves only what it declares. Phosphor
# imports React's types and Playwright imports Electron's API without
# declaring them; optional peers link them next to the package. Quint's
# Apalache client requires protobufjs and semver without declaring them.
packageExtensions:
  "@informalsystems/quint":
    dependencies:
      protobufjs: 7.6.6
      semver: 7.7.4
  "@phosphor-icons/react":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  playwright-core:
    peerDependencies:
      electron: "*"
    peerDependenciesMeta:
      electron:
        optional: true
