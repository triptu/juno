packages:
  - apps/*
  - packages/*
  - docs/juno-agent/spikes

# pnpm 12 refuses to run dependency install scripts unless each package is
# approved or denied here. electron needs its postinstall to download the
# binary; esbuild uses one to pick its platform binary.
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  # pi-ai pulls in the Google and gRPC SDKs as lazy chunks; Juno uses only its
  # OpenRouter provider and does not need their postinstall scripts.
  "@google/genai": false
  protobufjs: false

# pnpm 12 holds back versions younger than its minimum release age. effect
# 4.0.3 was published a day before this file was written, so it is excluded
# from that policy on purpose.
minimumReleaseAgeExclude:
  - effect@4.0.3
  # vitest 5.0.4 and its @vitest/* parts were published the day fake-slack was
  # set up.
  - vitest@5.0.4
  - "@vitest/*"
  - "@earendil-works/chord@1.2.0"
  - "@earendil-works/pi-ai@1.2.0"
  - "@earendil-works/pi-codemode@1.2.0"
  - "@earendil-works/pi-durable@1.2.0"
  - "@earendil-works/pi-mcp@1.2.0"
  - "@earendil-works/pi-telemetry@1.2.0"

# The agent's tests use @juno/agent-testing, which imports the agent's crash
# points: a test-only cycle. check-deps leaves test-only edges out of its cycle
# check and fails on any other cycle; this tells `pnpm -r` the same.
ignoreWorkspaceCycles: true
