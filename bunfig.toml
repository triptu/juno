[install]
# Isolated layout: a package resolves only what it declares.
linker = "isolated"
# Every checkout links packages from one shared store, so a worktree's
# node_modules stays small and cheap to create and remove.
globalStore = true
# Hold back versions published less than a day ago.
minimumReleaseAge = 86400

[test]
# The unit tests of every package that runs `bun test` (scripts/unit.mjs runs
# them together with --parallel). The same preload as each package's own
# bunfig.toml: Node-compatible SQLite and the default test timeout.
preload = ["./packages/testing/src/preload.ts"]
# Playwright specs and docs are not unit tests. The repository scripts' tests run by path (test:repo-tools, test:runner).
pathIgnorePatterns = ["apps/desktop/e2e/**", "apps/desktop/packaging/**", "apps/gallery/**", "docs/**", "specs/**", "**/node_modules/**"]
