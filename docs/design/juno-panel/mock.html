<style>
@font-face { font-family: 'Figtree Variable'; font-weight: 300 900; font-display: block; src: url('../home/fonts/figtree-latin-wght-normal.woff2') format('woff2-variations'); }
@font-face { font-family: 'Instrument Serif'; font-weight: 400; font-display: block; src: url('../home/fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); }

/* Tokens: packages/tokens/src/tokens.stylex.ts and themes.stylex.ts, Coral accent. */
.theme-light {

  --border-subtle: hsla(48, 30%, 92%, 1); --border-default: hsla(48, 30%, 91%, 1); --border-strong: hsla(48, 30%, 88%, 1); --input-border: hsla(48, 14%, 82%, 1);
  --foreground-default: hsla(48, 15%, 12%, 1); --foreground-subtle: hsla(48, 8%, 35%, 1); --foreground-muted: hsla(48, 5%, 42%, 1);
  --hl: #CC4628; --hl-fg: #FFFFFF; --hl-text: #B4351F; --hl-soft: color-mix(in oklch, #CC4628 10%, var(--background));
  --warning: #E0A500; --info: #008AB3;
  --shadow-sm: 0 1px 2px 0 rgba(27, 28, 21, 0.04);
  --card-ring: 0 1px 2px 0 oklch(0 0 0 / .03), 0 6px 20px -4px oklch(0 0 0 / .07);
  --pop-shadow: 0 2px 6px -1px oklch(0 0 0 / 0.05), 0 14px 36px -8px oklch(0 0 0 / 0.13);
  --sheet: #EFEDE6; --lights: #E1DFD6;
}
.theme-dark {
  --background: #1B1916; --background-subtle: #151411;
  --surface-default: #252421; --surface-hover: #2D2B28; --surface-raised: #373532;
  --secondary-default: #302F2C; --secondary-hover: #383633; --secondary-active: #403E3A;
  --border-subtle: #2B2A27; --border-default: #32302D; --border-strong: #3C3A37; --input-border: #464541;
  --foreground-default: #EEEBE2; --foreground-subtle: #C6C4BE; --foreground-muted: #A09E9A;
  --hl: #FF8A73; --hl-fg: #2A0D06; --hl-text: #FF9C87; --hl-soft: color-mix(in oklch, #FF8A73 14%, var(--background));
  --warning: #E0A500; --info: #008AB3;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --card-ring: 0 1px 2px 0 oklch(0 0 0 / .3), 0 6px 20px -4px oklch(0 0 0 / .35);
  --pop-shadow: 0 2px 6px -1px oklch(0 0 0 / 0.3), 0 14px 36px -8px oklch(0 0 0 / 0.5);
  --sheet: #0F0E0C; --lights: #3A3834;
}
.theme-light, .theme-dark {

  --tint-private-bg: color-mix(in oklch, var(--warning) 15%, var(--background)); --tint-private-fg: color-mix(in oklch, var(--warning) 42%, var(--foreground-default));
  --tint-dm-bg: color-mix(in oklch, var(--info) 12%, var(--background)); --tint-dm-fg: color-mix(in oklch, var(--info) 55%, var(--foreground-default));
}
:root {
  --font-sans: 'Figtree Variable', ui-sans-serif, system-ui, sans-serif;
  --font-serif: 'Instrument Serif', ui-serif, Georgia, serif;
}

* { box-sizing: border-box; cursor: default; }
body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.5; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; background: #ddd; }

/* Window frame. */
.win { display: flex; border-radius: 12px; overflow: hidden; box-shadow: var(--card-ring), 0 0 0 1px var(--border-default); background: var(--background); position: relative; }
.work { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--background); }

.me { width: 24px; height: 24px; border-radius: 50%; margin-left: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: color-mix(in oklch, #92C2F9 24%, var(--surface-default)); color: color-mix(in oklch, #92C2F9 62%, var(--foreground-default)); }

.ni .cnt { margin-left: auto; height: 18px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--secondary-active); color: var(--foreground-subtle); font-size: 11px; font-weight: 500; display: grid; place-items: center; }

/* Tab strip. */
.strip { height: 44px; flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; background: var(--background-subtle); border-bottom: 1px solid var(--border-default); }

.tab { flex: 0 1 230px; min-width: 120px; height: 35px; margin-bottom: -1px; padding: 0 6px 0 12px; border-radius: 8px 8px 0 0; border: 1px solid transparent; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--foreground-subtle); position: relative; }

/* Topic header. */

.list { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }

.av.a { background: color-mix(in oklch, #E89EB8 24%, var(--surface-default)); color: color-mix(in oklch, #E89EB8 62%, var(--foreground-default)); }

.mb { flex: 1; min-width: 0; }

.tlink { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 6px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--border-default); background: var(--surface-default); font-size: 12.5px; color: var(--foreground-subtle); margin-top: 6px; }

/* Composer and the picker row. */
.comp { flex: none; padding: 8px 24px 20px; }

.pk { height: 28px; padding: 0 8px 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--secondary-default); color: var(--foreground-default); max-width: 320px; }
.pk .v { overflow: hidden; text-overflow: ellipsis; }

/* Popover lists. */
.pop { position: absolute; width: 340px; border-radius: 13px; background: var(--surface-default); box-shadow: var(--pop-shadow), 0 0 0 1px var(--border-default); overflow: hidden; z-index: 5; }

.menu { position: absolute; width: 236px; padding: 5px; border-radius: 13px; background: var(--surface-default); box-shadow: var(--pop-shadow), 0 0 0 1px var(--border-default); z-index: 6; }
.mi { height: 30px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; }

.sep { height: 1px; background: var(--border-default); margin: 4px 6px; }

.note { position: absolute; font-size: 11.5px; color: var(--hl-text); font-weight: 600; white-space: nowrap; }
</style>

  <div data-t="t-talk"></div>
  <p class="cap">Each message sent from the panel carries "About {topic}". Selecting Maya's sentence in the topic put it above the composer as a removable quote. Sending to Slack is still a card with one click; what Juno read in the topic counts as Slack content, so anything that would need no click becomes a card too.</p>
